name: Update EFL Feed

on:
  workflow_dispatch: {}
  schedule:
    # Native GitHub cron is unreliable under load (can slip hours) --
    # this is a backup only. cron-job.org drives the real 15-min cadence
    # via workflow_dispatch once that's set up. Offset off :00/:15/:30/:45
    # to avoid the congestion everyone else's cron creates at those marks.
    - cron: "7,37 * * * *"
  push:
    branches: [main]

# A single stuck run can jam this group forever ("waiting for run #X to
# complete" pointing at a dead run). If deploys mysteriously stop, rename
# this group (e.g. pages -> pages-clean) to orphan the stuck run for free.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  # write, not read: the "Commit updated articles.json" step pushes back to
  # the repo. With `read` that push failed on EVERY run (hidden behind an
  # `|| echo`), so merge-with-previous never worked -- each run started from
  # scratch and two-thirds of the Google News rotation vanished each time.
  # Bot pushes made with this token don't trigger new workflow runs.
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # feedparser alone is NOT enough -- fetch_news.py also needs
        # requests. Missing it crashes silently before the deploy step,
        # so nothing updates and there's no obvious error unless you
        # check this step's log directly.
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python3 fetch_news.py

      - name: Fetch standings
        # Table/results data doesn't need 15-min polling like news does --
        # this is cheap and safe to run every time regardless.
        run: python3 fetch_standings.py

      - name: Build site
        run: python3 build_site.py

      - name: Commit updated articles.json
        # Persist the merge-with-previous state back to the repo so the
        # next run (and a human browsing history) can see it. Skips
        # cleanly if nothing changed. Rebases first in case you committed
        # a file through the GitHub website while this run was going.
        # A failed push is shown as a yellow warning on the run instead of
        # being silently swallowed -- that silence hid this step never
        # working at all.
        run: |
          git config user.name "efl-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json standings.json
          if git diff --cached --quiet; then
            echo "no article changes"
          else
            git commit -q -m "Update articles [skip ci]"
            git pull --rebase -q origin main || echo "::warning::Rebase before saving articles.json failed"
            git push -q || echo "::warning::Could not save articles.json back to the repo -- next run will start without this run's stories"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
